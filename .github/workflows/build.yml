# Build Channel Reaction using GitHub-hosted Android build tools.
# All application source files are bundled within this single workflow.
# No Android Studio / Android SDK required on your device.
name: Build Channel Reaction APK (Cloud)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

